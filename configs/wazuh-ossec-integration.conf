<!-- Wazuh custom-misp integration block
     Add inside <ossec_config> in /var/ossec/etc/ossec.conf
     API key is REDACTED - replace with your own MISP key. -->
<integration>
  <name>custom-misp</name>
  <hook_url>https://192.168.18.130/attributes/restSearch</hook_url>
  <api_key>REDACTED</api_key>
  <alert_format>json</alert_format>
  <rule_id>2502,5760,5763,5503,5715,100002,554</rule_id>
</integration>

<!-- Custom rule: flags the MISP-registered known-bad Kali IP -->
<rule id="100002" level="12">
  <match>192.168.18.128</match>
  <description>Connection from MISP-registered known-bad IP (Kali)</description>
</rule>
