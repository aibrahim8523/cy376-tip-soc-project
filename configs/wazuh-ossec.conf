<!--
  /var/ossec/etc/ossec.conf  (EXCERPT — SANITISED)
  The single integration block that gives Wazuh its threat-intelligence
  capability. Every alert above the configured rule_id is enriched with
  matching context from MISP.
-->
<ossec_config>
  <integrations>
    <integration>
      <name>custom-misp</name>
      <hook_url>https://192.168.100.10/attributes/restSearch</hook_url>
      <api_key><paste-your-misp-api-key-here></api_key>
      <alert_format>json</alert_format>
      <rule_id>5715,100002</rule_id>
    </integration>
  </integrations>
</ossec_config>

<!--
  To generate the MISP API key referenced above:
    1. Log in to MISP as an admin user.
    2. Go to Administration → List Users → your user.
    3. Open the "Auth Keys" tab and click "Add auth key".
    4. Copy the key (MISP shows it only ONCE) and paste it above.
    5. Restart Wazuh: sudo systemctl restart wazuh-manager
    6. Verify in /var/ossec/logs/integrations.log that MISP queries succeed.
-->
